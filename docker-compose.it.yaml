# 数据库迁移/同步「集成测试」专用环境（非生产）。
#
# 做法：测试所需的真实数据库由
# 容器按需拉起，测试连上后在**进程独占的随机临时库**里跑（见 ititest/scratchclean），
# 结束即删库；不污染共享业务库。端口/账号与 *_it_test.go 中的连接信息一一对应。
#
# 用法：
#   docker compose -f docker-compose.it.yaml up -d          # 起 mysql/pg/mssql/oracle
#   # 首次需为 Oracle 建测试用户（见文件末尾说明）
#   MAYFLY_IT_REQUIRED_DIALECTS=mssql,oracle make itest      # 声明必须真实执行的方言，缺席即失败
#   docker compose -f docker-compose.it.yaml down -v         # 用完清理，避免磁盘堆积
#
# 说明：mysql(:3306)/postgres(:5432) 若已在宿主机运行，可只 `up -d mssql oracle`。
name: mayfly-it

services:
  it-mysql:
    image: mysql:8.0
    container_name: mayfly-it-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "111049"
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p111049"]
      interval: 10s
      timeout: 5s
      retries: 12

  # mysql 8.0 首次初始化会自动生成自签服务端证书（have_ssl=YES），无需额外配置即可跑 TLS 用例：
  #   docker exec mayfly-it-mysql cat /var/lib/mysql/ca.pem > /tmp/mysql-ca.pem
  #   MAYFLY_IT_MYSQL_TLS_CA_FILE=/tmp/mysql-ca.pem go test ./internal/db/dbm/itest -run TestMySQLTLSHandshake
  # 该证书只有 CN 没有 SAN，因此真握手用例覆盖 require 与 verify-ca（verify-full 对这类证书必然失败）。
  it-postgres:
    image: postgres:16
    container_name: mayfly-it-pg
    environment:
      POSTGRES_PASSWORD: "postgres"
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 带自签 TLS 的 postgres（端口 15432）：用于验证 require / verify-ca / verify-full 三档真握手。
  # 证书在容器启动时生成，SAN 含 DNS:localhost 与 IP:127.0.0.1——这样 verify-full 才可能通过
  # （MySQL 自签证书只有 CN 没有 SAN，verify-full 对它必然失败，两套用例覆盖不同档位）。
  # 取 CA：
  #   docker exec mayfly-it-pg-tls cat /tmp/pgtls/ca.crt > /tmp/pg-ca.pem
  #   MAYFLY_IT_PG_TLS_CA_FILE=/tmp/pg-ca.pem go test ./internal/db/dbm/itest -run TestPostgresTLSHandshake
  it-pg-tls:
    image: postgres:16
    container_name: mayfly-it-pg-tls
    environment:
      POSTGRES_PASSWORD: "postgres"
    ports: ["15432:5432"]
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /tmp/pgtls && cd /tmp/pgtls
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 3650 -subj "/CN=mayfly-it-pg-ca"
        openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3650 \
          -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
        chmod 600 server.key
        chown -R postgres:postgres /tmp/pgtls
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/pgtls/server.crt -c ssl_key_file=/tmp/pgtls/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  it-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mayfly-it-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mayfly_123456"
      MSSQL_PID: "Developer"
    ports: ["11433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Mayfly_123456 -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  it-oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: mayfly-it-oracle
    environment:
      ORACLE_PWD: "Mayfly_12345"
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD-SHELL", "lsnrctl status | grep -q FREEPDB1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40

# Oracle 首次就绪后，为集成测试建用户（IT 以 mayfly/Mayfly_123456 连 FREEPDB1）：
#   docker exec mayfly-it-oracle bash -c \
#     "echo 'ALTER SESSION SET CONTAINER=FREEPDB1;
#      CREATE USER mayfly IDENTIFIED BY \"Mayfly_123456\";
#      GRANT CONNECT, RESOURCE, DBA TO mayfly;' | sqlplus -s sys/Mayfly_12345@//localhost:1521/FREE as sysdba"
